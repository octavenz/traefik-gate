name: Build and publish image

# Publishes to GitHub Packages (GHCR) as ghcr.io/<owner>/traefik-gate.
#
# Tagging:
#   - push to main        -> :latest + :sha-<short>
#   - push tag vX.Y.Z     -> :X.Y.Z, :X.Y, :latest
#
# Consumers (e.g. the boxrank gate nomad job) should pin a version tag, not
# :latest, so a gate deploy is always a deliberate, reproducible action.
#
# NOTE: the first published package is PRIVATE by default. Make it public once:
# GitHub -> the package -> Package settings -> Danger Zone -> Change visibility.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/traefik-gate

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 covers the AWS t3 hosts; arm64 for local testing on Apple silicon.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
